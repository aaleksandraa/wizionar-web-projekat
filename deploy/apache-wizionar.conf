# Apache vhost for wizionar.com
# Copy to /etc/apache2/sites-available/wizionar.conf
# then: a2enmod proxy proxy_http headers rewrite ssl
#        a2ensite wizionar
#        systemctl reload apache2
#
# Recommended: proxy the whole site to Node on 127.0.0.1:3000.
# Node serves the built frontend from dist/ and handles /api/project-inquiry.

<VirtualHost *:80>
    ServerName wizionar.com
    ServerAlias www.wizionar.com wizionar.app www.wizionar.app

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "http"
    RequestHeader set X-Real-IP %{REMOTE_ADDR}s

    ProxyPass / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/

    ErrorLog ${APACHE_LOG_DIR}/wizionar-error.log
    CustomLog ${APACHE_LOG_DIR}/wizionar-access.log combined
</VirtualHost>

# After certbot --apache, HTTPS should look like this:
#
# <VirtualHost *:443>
#     ServerName wizionar.com
#     ServerAlias www.wizionar.com wizionar.app www.wizionar.app
#
#     SSLEngine on
#     SSLCertificateFile /etc/letsencrypt/live/wizionar.com/fullchain.pem
#     SSLCertificateKeyFile /etc/letsencrypt/live/wizionar.com/privkey.pem
#
#     ProxyPreserveHost On
#     RequestHeader set X-Forwarded-Proto "https"
#     RequestHeader set X-Real-IP %{REMOTE_ADDR}s
#
#     ProxyPass / http://127.0.0.1:3000/
#     ProxyPassReverse / http://127.0.0.1:3000/
# </VirtualHost>
#
# Alternative if Apache must keep serving /var/www/wizionar/dist statically
# and only API goes to Node:
#
# DocumentRoot /var/www/wizionar/dist
# <Directory /var/www/wizionar/dist>
#     AllowOverride All
#     Require all granted
# </Directory>
# ProxyPreserveHost On
# ProxyPass /api http://127.0.0.1:3000/api
# ProxyPassReverse /api http://127.0.0.1:3000/api
